<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theater — Watch Party</title>
    <link rel="stylesheet" href="css/styles.css?v=19" />
  </head>
  <body class="theater-page">
    <div class="page">
      <header class="topbar">
        <a href="index.html" class="topbar-brand">Watch <span>Party</span></a>
        <div class="topbar-actions">
          <button
            type="button"
            class="btn btn-ghost topbar-btn"
            id="change-movie-btn"
            hidden
          >
            Change movie
          </button>
          <div class="room-badge">
            <span class="conn-dot" id="conn-dot" aria-hidden="true"></span>
            Room <code id="room-code-display">————</code>
            <span class="room-count" id="room-count" aria-live="polite">1 online</span>
          </div>
        </div>
      </header>

      <!-- Guest waiting until host picks a movie -->
      <div class="waiting-guest" id="waiting-view" hidden>
        <h1>Waiting for the host</h1>
        <p id="waiting-copy">You&apos;re in the room. The theater opens when the host picks a movie.</p>
        <div class="spinner" aria-hidden="true"></div>
        <p class="status-msg" id="waiting-status" role="status"></p>
      </div>

      <div class="theater-layout" id="theater-view" hidden>
        <div class="player-column">
          <p class="now-playing">
            Now playing: <strong id="movie-title">—</strong>
            <span class="player-pickers">
              <label class="quality-picker" id="quality-picker" hidden>
                <span class="quality-picker-label">Quality</span>
                <select id="quality-select" aria-label="Video quality"></select>
              </label>
              <label class="quality-picker" id="speed-picker" hidden>
                <span class="quality-picker-label">Speed</span>
                <select id="speed-select" aria-label="Playback speed">
                  <option value="0.5">0.5x</option>
                  <option value="0.75">0.75x</option>
                  <option value="1" selected>1x</option>
                  <option value="1.25">1.25x</option>
                  <option value="1.5">1.5x</option>
                  <option value="2">2x</option>
                </select>
              </label>
            </span>
          </p>
          <p class="party-status" id="party-status" role="status" hidden></p>
          <div class="player-shell" id="player-shell">
            <div class="video-stage">
              <div class="reactions-layer" id="reactions-layer" aria-hidden="true"></div>
              <video
                id="player"
                controls
                playsinline
                webkit-playsinline
                controlslist="nofullscreen"
                preload="metadata"
              ></video>
              <button
                type="button"
                class="fs-toggle"
                id="fs-toggle"
                aria-pressed="false"
                aria-label="Enter fullscreen"
                title="Fullscreen"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              </button>
              <button
                type="button"
                class="emoji-toggle"
                id="emoji-toggle"
                aria-pressed="true"
                aria-controls="emoji-bar"
                aria-label="Hide reactions"
                title="Hide reactions"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <button
                type="button"
                class="dnd-toggle"
                id="dnd-toggle"
                aria-pressed="false"
                aria-label="Do Not Disturb"
                title="Do Not Disturb — hide floating messages"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/><line x1="4" y1="4" x2="20" y2="20"/></svg>
              </button>
            </div>
            <div class="emoji-bar" id="emoji-bar" role="toolbar" aria-label="Reactions"></div>
          </div>
        </div>

        <aside class="chat-panel" aria-label="Chat">
          <div class="chat-header">Chat</div>
          <div class="chat-messages" id="chat-messages">
            <p class="chat-empty" id="chat-empty">Say hi — messages sync in real time.</p>
          </div>
          <form class="chat-form" id="chat-form">
            <input
              type="text"
              id="chat-input"
              maxlength="500"
              placeholder="Type a message…"
              autocomplete="off"
              aria-label="Message"
            />
            <button type="submit" class="btn btn-primary">Send</button>
          </form>
        </aside>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js?v=15"></script>
    <script src="js/peer.js?v=19"></script>
    <script src="js/qualities.js?v=1"></script>
    <script src="js/sync.js?v=16"></script>
    <script src="js/chat.js?v=15"></script>
    <script src="js/reactions.js?v=15"></script>
    <script src="js/fullscreen.js?v=5"></script>
    <script src="js/theater.js?v=19"></script>
  </body>
</html>
